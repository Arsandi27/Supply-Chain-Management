{% if messages %}
    {% for message in messages %}
        {% if page_tag in message.tags %}
        <div id="msgOverlay"
            class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[9999] flex items-center justify-center p-4 transition-all duration-300 opacity-100">
            
            <div id="msgBox"
                class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 text-center transform scale-100 transition-all duration-300">

                <div class="msg-item flex flex-col items-center">
                    {% if 'error' in message.tags %}
                    <div class="w-16 h-16 bg-red-50 border border-red-200 text-red-500 rounded-full flex items-center justify-center mb-4 shadow-sm animate-bounce">
                        <svg class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </div>
                    <h4 class="text-lg font-bold text-gray-900 mb-2">Proses Gagal!</h4>
                    {% else %}
                    <div class="w-16 h-16 bg-emerald-50 border border-emerald-200 text-emerald-500 rounded-full flex items-center justify-center mb-4 shadow-sm animate-pulse">
                        <svg class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                        </svg>
                    </div>
                    <h4 class="text-lg font-bold text-gray-900 mb-2">Berhasil!</h4>
                    {% endif %}

                    <p class="text-sm text-gray-600 mb-6 leading-relaxed">{{ message }}</p>
                </div>

                <button onclick="closeMsgPopUp()"
                    class="w-full py-2.5 px-4 bg-[#191970] hover:bg-[#20208c] text-white font-medium rounded-xl transition-colors duration-150 focus:outline-none shadow-md">
                    Mengerti
                </button>
            </div>
        </div>
        <script>
            function closeMsgPopUp() {
                const overlay = document.getElementById('msgOverlay');
                const box = document.getElementById('msgBox');

                if (overlay && box) {
                    overlay.classList.remove('opacity-100');
                    overlay.classList.add('opacity-0');

                    box.classList.remove('scale-100');
                    box.classList.add('scale-95');

                    setTimeout(() => {
                        overlay.remove();
                    }, 300);
                }
            }
        </script>
        {% endif %}
    {% endfor %}
{% endif %}
