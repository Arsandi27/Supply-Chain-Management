{%load static%}
<link rel="stylesheet" href="{%static 'css/sidebar_qc.css' %}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<div class="sidebar" style="border-radius: 4px; ">
    <div class="sidebar-top">
    <h3 class="sidebar-title">
        <a href="{% url 'dashboard_qc' %}" class="sidebar-title-link">
            <img src="{% static 'images/logo_laco2.png' %}" alt="Logo" class="sidebar-logo-circle">
            <span>Quality Control</span>
        </a>
    </h3>
    <hr class="sidebar-divider">
    <ul class="sidebar-menu">
        <li class="{% if request.path == '/qc/quality/' %}active{% endif %}">
            <a href="{% url 'quality_list' %}">
                <!-- Icon: Check Badge (Quality) -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" width="20" height="20" style="margin-right: 8px; vertical-align: middle;">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9 12.75 11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 0 1-1.043 3.296 3.745 3.745 0 0 1-3.296 1.043A3.745 3.745 0 0 1 12 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 0 1-3.296-1.043 3.745 3.745 0 0 1-1.043-3.296A3.745 3.745 0 0 1 3 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 0 1 1.043-3.296 3.746 3.746 0 0 1 3.296-1.043A3.746 3.746 0 0 1 12 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 0 1 3.296 1.043 3.746 3.746 0 0 1 1.043 3.296A3.745 3.745 0 0 1 21 12Z" />
                </svg>
                <span>Nama Quality</span>
            </a>
        </li>

        <li class="{% if request.path == '/qc/qc/' %}active{% endif %}">
            <a href="{% url 'qc_list' %}">
                <!-- Icon: Clipboard Document Check (Validasi Quality) -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" width="20" height="20" style="margin-right: 8px; vertical-align: middle;">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M11.35 3.836c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m8.9-4.414c.376.023.75.05 1.124.08 1.131.094 1.976 1.057 1.976 2.192V16.5A2.25 2.25 0 0 1 18 18.75h-2.25m-7.5-10.5H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V18.75m-7.5-10.5h6.375c.621 0 1.125.504 1.125 1.125v9.375m-8.25-3 1.5 1.5 3-3.75" />
                </svg>
                <span>Validasi Quality</span>
            </a>
        </li>
    </div>
     <div class="sidebar-bottom">
        <hr class="sidebar-divider">
        <ul class="sidebar-menu">
            <li class="logout-item">
                <a href="#" onclick="openLogoutModal()">
                    <!-- Icon Logout -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" width="20" height="20" style="margin-right: 8px; vertical-align: middle;">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6A2.25 2.25 0 0 0 5.25 5.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
                    </svg>
                    <span>Logout</span>
                </a>
            </li>
        </ul>
    </div>
</div>


<div id="logoutModal" class="logout-modal">
    <div class="logout-modal-content">
        <h2>Konfirmasi Logout</h2>
        <p>Apakah anda yakin mau logout?</p>

        <div class="logout-modal-buttons">
            <button class="btn-cancel" onclick="closeLogoutModal()">
                Batal
            </button>

            <a href="{% url 'logout' %}" class="btn-logout">
                Logout
            </a>
        </div>
    </div>
</div>

<script>
    function openLogoutModal() {
        document.getElementById("logoutModal").style.display = "flex";
    }

    function closeLogoutModal() {
        document.getElementById("logoutModal").style.display = "none";
    }

    window.onclick = function (event) {
        const modal = document.getElementById("logoutModal");

        if (event.target === modal) {
            modal.style.display = "none";
        }
    }
</script>
