{% load static %}
<link rel="stylesheet" href="{% static 'css/sidebar_purchasing.css' %}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<div class="sidebar">
    <div class="sidebar-top">
        <h3 class="sidebar-title">
            <a href="{% url 'dashboard_purchasing' %}" class="sidebar-title-link">
                <img src="{% static 'images/logo_laco2.png' %}" alt="Logo" class="sidebar-logo-circle">
                <span>Purchasing</span>
            </a>
        </h3>
        <!-- GARIS PEMBATAS -->
        <hr class="sidebar-divider">
        
        <ul class="sidebar-menu">
            <li class="{% if request.path == '/purchasing/supplier/' %}active{% endif %}">
                <a href="{% url 'supplier_list' %}">
                    <!-- Icon: Truck (Supplier) -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" width="20" height="20" style="margin-right: 8px; vertical-align: middle;">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M8.25 18.75a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 0 1-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 0 0-3.213-9.193 2.056 2.056 0 0 0-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 0 0-10.026 0 1.106 1.106 0 0 0-.987 1.106v7.635m12-6.677v6.677m0 4.5v-4.5m0 0h-12" />
                    </svg>
                    <span>Nama Supplier</span>
                </a>
            </li>

            <li class="{% if request.path == '/purchasing/bahanbaku/' %}active{% endif %}">
                <a href="{% url 'bahanbaku_list' %}">
                    <!-- Icon: Box/Cube (Bahan Baku) -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" width="20" height="20" style="margin-right: 8px; vertical-align: middle;">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="m21 7.5-9-5.25L3 7.5m18 0-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9" />
                    </svg>
                    <span>Nama Bahan Baku</span>
                </a>
            </li>

            <li class="{% if request.path == '/purchasing/bahan-baku-masuk/' %}active{% endif %}">
                <a href="{% url 'bahan_baku_masuk_list' %}">
                    <!-- Icon: Arrow Down to Box (Bahan Baku Masuk) -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" width="20" height="20" style="margin-right: 8px; vertical-align: middle;">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9 8.25H7.5a2.25 2.25 0 0 0-2.25 2.25v9a2.25 2.25 0 0 0 2.25 2.25h9a2.25 2.25 0 0 0 2.25-2.25v-9a2.25 2.25 0 0 0-2.25-2.25H15M9 12l3 3m0 0 3-3m-3 3V2.25" />
                    </svg>
                    <span>Bahan Baku Masuk</span>
                </a>
            </li>

            <li class="{% if request.path == '/purchasing/rekap-bahan-baku/' %}active{% endif %}">
                <a href="{% url 'rekap_bahan_baku' %}">
                    <!-- Icon: Stacked Boxes (Rekap Bahan Baku) -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" width="20" height="20" style="margin-right: 8px; vertical-align: middle;">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M6.429 9.75 2.25 12l4.179 2.25m0-4.5 5.571 3 5.571-3m-11.142 0L2.25 7.5 12 2.25l9.75 5.25-4.179 2.25m0 0L21.75 12l-4.179 2.25m0 0 4.179 2.25L12 21.75 2.25 16.5l4.179-2.25m11.142 0-5.571 3-5.571-3" />
                    </svg>
                    <span>Laporan Bahan Baku Masuk</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- TOMBOL LOGOUT DIPINDAHKAN KE SINI (PALING BAWAH) -->
    <div class="sidebar-bottom">
        <hr class="sidebar-divider">
        <ul class="sidebar-menu">
            <li class="logout-item">
                <a href="javascript:void(0)" onclick="openLogoutModal()">
                    <!-- Icon Logout -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" width="20" height="20" style="margin-right: 8px; vertical-align: middle;">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6A2.25 2.25 0 0 0 5.25 5.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
                    </svg>
                    <span>Logout</span>
                </a>
            </li>
        </ul>
    </div>
</div>

<!-- Modal & Script tetap sama di bawahnya -->
<div id="logoutModal" class="logout-modal">
    <div class="logout-modal-content">
        <h2>Konfirmasi Logout</h2>
        <p>Apakah anda yakin mau logout?</p>
        <div class="logout-modal-buttons">
            <button class="btn-cancel" onclick="closeLogoutModal()">Batal</button>
            <a href="{% url 'logout' %}" class="btn-logout">Logout</a>
        </div>
    </div>
</div>

<script>
    function openLogoutModal() {
        document.getElementById("logoutModal").style.display = "flex";
    }

    function closeLogoutModal() {
        document.getElementById("logoutModal").style.display = "none";
    }

    window.addEventListener("click", function (event) {
        const modal = document.getElementById("logoutModal");

        if (event.target === modal) {
            closeLogoutModal();
        }
    });

    // Tangkap tombol back / swipe back browser
    window.addEventListener("load", function () {
        history.pushState(null, null, location.href);

        window.addEventListener("popstate", function () {
            history.pushState(null, null, location.href);
            openLogoutModal();
        });
    });
</script>
