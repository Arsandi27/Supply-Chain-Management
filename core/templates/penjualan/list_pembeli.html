{% load static %}
<!DOCTYPE html>
<html>

<head>
    <title>Data Pembeli</title>
    <link rel="stylesheet" href="{% static 'css/penjualan.css' %}">
    <style>
        body {
            font-family: Arial;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background: #f4f4f4;
        }

        button {
            padding: 6px 10px;
            cursor: pointer;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background: white;
            width: 400px;
            margin: 10% auto;
            padding: 20px;
            border-radius: 5px;
        }

        .close {
            float: right;
            cursor: pointer;
            color: red;
        }
    </style>
</head>

<body>
    {% include 'parts/sidebar_penjualan.html' %}
    <div class="content">
    <h2>Data Pembeli</h2>
    <button onclick="openAddModal()">+ Tambah Pembeli</button>

    <br><br>

    <table>
        <tr>
            <th>Nama</th>

            <th>Aksi</th>
        </tr>

        {% for s in data %}
        <tr>
            <td>{{ s.nama_pembeli}}</td>
            <td>
                <button onclick="openEditModal('{{ s.id }}','{{ s.nama_pembeli }}')">Edit</button>
                <button onclick="openDeleteModal('{{ s.id }}')">Hapus</button>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
    <!-- ================= MODAL TAMBAH ================= -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('addModal')">X</span>
            <h3>Tambah Supplier</h3>

            <form method="post" action="/pembeli/add/">
                {% csrf_token %}
                <input type="text" name="nama_pembeli" placeholder="Nama Pembeli" required><br><br>
                <button type="submit">Simpan</button>
            </form>
        </div>
    </div>

    <!-- ================= MODAL EDIT ================= -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('editModal')">X</span>
            <h3>Edit Supplier</h3>

            <form method="post" id="editForm">
                {% csrf_token %}
                <input type="text" name="nama_pembeli" id="editNama" required><br><br>
                <button type="submit">Update</button>
            </form>
        </div>
    </div>

    <!-- ================= MODAL HAPUS ================= -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('deleteModal')">X</span>
            <h3>Hapus Data?</h3>

            <form method="post" id="deleteForm">
                {% csrf_token %}
                <button type="submit">Ya, Hapus</button>
            </form>
        </div>
    </div>

    <script>
        function openAddModal() {
            document.getElementById('addModal').style.display = 'block';
        }

        function openEditModal(id, nama, alamat, kontak) {
            document.getElementById('editModal').style.display = 'block';
            document.getElementById('editNama').value = nama;
            document.getElementById('editForm').action = '/pembeli/edit/' + id + '/';
        }

        function openDeleteModal(id) {
            document.getElementById('deleteModal').style.display = 'block';
            document.getElementById('deleteForm').action = '/pembeli/delete/' + id + '/';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }
    </script>

</body>

</html>
