{%load static%}
<!DOCTYPE html>
<html>

<head>
    <title>Data Quality</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/qc.css' %}">
</head>

<body class="bg-gray-50 flex h-screen overflow-hidden text-gray-800">
    {% include 'parts/sidebar_qc.html' %}
    <main class="flex-1 h-full overflow-y-auto p-6" style="margin-left: 256px;">
        <div class="content">
            <h2 class="text-2xl font-bold mb-4">Data Quality</h2>
            <button class="btn bg-blue-500 text-white rounded px-4 py-2 hover:bg-blue-600" onclick="openAddModal()">+ Tambah Quality</button>

            <br><br>

            <table>
                <tr>
                    <th>No</th>
                    <th>Nama</th>
                    <th>Aksi</th>
                </tr>

                {% for s in data %}
                <tr>
                    <td>{{ forloop.counter }}</td>
                    <td>{{ s.quality }}</td>
                    <td>
                        <button onclick="openEditModal('{{ s.id }}','{{ s.quality }}')">Edit</button>
                        <button onclick="openDeleteModal('{{ s.id }}')">Hapus</button>
                    </td>
                </tr>
                {% endfor %}
            </table>
        </div>
    </main>
    <!-- ================= MODAL TAMBAH ================= -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('addModal')">X</span>
            <h3>Tambah Quality</h3>

            <form method="post" action="/quality/add/">
                {% csrf_token %}
                <input type="text" name="quality" placeholder="Quality" required><br><br>
                <button type="submit">Simpan</button>
            </form>
        </div>
    </div>

    <!-- ================= MODAL EDIT ================= -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('editModal')">X</span>
            <h3>Edit Supplier</h3>

            <form method="post" id="editForm">
                {% csrf_token %}
                <input type="text" name="quality" id="editQuality" required><br><br>
                <button type="submit">Update</button>
            </form>
        </div>
    </div>

    <!-- ================= MODAL HAPUS ================= -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('deleteModal')">X</span>
            <h3>Hapus Data?</h3>

            <form method="post" id="deleteForm">
                {% csrf_token %}
                <button type="submit">Ya, Hapus</button>
            </form>
        </div>
    </div>

</body>

<script>
    function openAddModal() {
        document.getElementById('addModal').style.display = 'block';
    }

    function openEditModal(id, nama, alamat, kontak) {
        document.getElementById('editModal').style.display = 'block';
        document.getElementById('editQuality').value = nama;
        document.getElementById('editForm').action = '/quality/edit/' + id + '/';
    }

    function openDeleteModal(id) {
        document.getElementById('deleteModal').style.display = 'block';
        document.getElementById('deleteForm').action = '/quality/delete/' + id + '/';
    }

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }
</script>

</html>
